[workspace]
resolver = "2"
members = [
    "crates/libquartz",
    "crates/quartz-session",
    "crates/quartz-quicklookd",
    "crates/quartz-spotlight",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pedro <pedro@whitequartz.org>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
nix = { version = "0.29", features = ["process", "signal", "user"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
